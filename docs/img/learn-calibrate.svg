<rect x="1" y="30" width="694" height="10" fill="#111725"/>
<line x1="1" y1="39.5" x2="695" y2="39.5" stroke="#1e2942"/>
<circle cx="22" cy="20" r="5" fill="#e05a5a" opacity="0.55"/>
<circle cx="39" cy="20" r="5" fill="#e8b04b" opacity="0.55"/>
<circle cx="56" cy="20" r="5" fill="#3fb984" opacity="0.55"/>
<text x="348.0" y="25" fill="#6b7a99" font-size="12.5" text-anchor="middle">meshctl learn calibrate</text>
<text x="26" y="62.0" fill="#ffffff" font-size="13" font-weight="600" xml:space="preserve">learned recovery probability  53994 observations</text>
<text x="26" y="102.0" fill="#5b8cff" font-size="13" xml:space="preserve">  mean stated               0.267</text>
<text x="26" y="122.0" fill="#5b8cff" font-size="13" xml:space="preserve">  observed rate             0.267</text>
<text x="26" y="142.0" fill="#5b8cff" font-size="13" xml:space="preserve">  understates by            0.001</text>
<text x="26" y="182.0" fill="#5b8cff" font-size="13" xml:space="preserve">  stated                 n    claimed   observed       gap</text>
<text x="26" y="202.0" fill="#5b8cff" font-size="13" xml:space="preserve">  [0.0, 0.1)        7704      0.066      0.074    -0.008</text>
<text x="26" y="222.0" fill="#5b8cff" font-size="13" xml:space="preserve">  [0.1, 0.2)        9833      0.154      0.163    -0.009</text>
<text x="26" y="242.0" fill="#5b8cff" font-size="13" xml:space="preserve">  [0.2, 0.3)       15046      0.254      0.259    -0.005</text>
<text x="26" y="262.0" fill="#5b8cff" font-size="13" xml:space="preserve">  [0.3, 0.4)       12259      0.347      0.337     0.010</text>
<text x="26" y="282.0" fill="#5b8cff" font-size="13" xml:space="preserve">  [0.4, 0.5)        6756      0.445      0.457    -0.012</text>
<text x="26" y="302.0" fill="#5b8cff" font-size="13" xml:space="preserve">  [0.5, 0.6)        2191      0.528      0.495     0.033</text>
<text x="26" y="322.0" fill="#5b8cff" font-size="13" xml:space="preserve">  [0.6, 0.7)         196      0.632      0.291     0.341</text>
<text x="26" y="342.0" fill="#5b8cff" font-size="13" xml:space="preserve">  [0.7, 0.8)           9      0.717      0.444     0.272  (thin)</text>
<text x="26" y="382.0" fill="#5b8cff" font-size="13" xml:space="preserve">  expected calibration error  0.0105</text>
<text x="26" y="402.0" fill="#5b8cff" font-size="13" xml:space="preserve">  worst bin                   0.3413</text>
<text x="26" y="422.0" fill="#5b8cff" font-size="13" xml:space="preserve">  noise floor at this size    0.0035</text>
<text x="26" y="442.0" fill="#e8b04b" font-size="13" xml:space="preserve">  verdict                     real miscalibration, not sampling noise</text>
<text x="26" y="462.0" fill="#5b8cff" font-size="13" xml:space="preserve">  after isotonic correction   0.0008  (cross-fitted, so honest)</text>
<text x="26" y="502.0" fill="#6b7a99" font-size="13" xml:space="preserve">  note: predictions are out of fold, so no attempt was scored by a model</text>
<text x="26" y="522.0" fill="#c8d3e8" font-size="13" xml:space="preserve">        that had seen its own outcome</text>
<text x="26" y="562.0" fill="#ffffff" font-size="13" font-weight="600" xml:space="preserve">inference tier stated confidence</text>
<text x="26" y="602.0" fill="#5b8cff" font-size="13" font-weight="600" xml:space="preserve">  not measured: 0 of 1080 cassettes carry a decline code whose class is fixed by</text>
<text x="26" y="622.0" fill="#5b8cff" font-size="13" xml:space="preserve">  the code itself, which is too few to calibrate against. The corpus</text>
<text x="26" y="642.0" fill="#5b8cff" font-size="13" xml:space="preserve">  was built to exercise ambiguous failures, where the class depends</text>
<text x="26" y="662.0" fill="#5b8cff" font-size="13" xml:space="preserve">  on telemetry the code does not carry, so a label taken from the</text>
<text x="26" y="682.0" fill="#5b8cff" font-size="13" xml:space="preserve">  code alone would be measuring the label rather than the model. See</text>
<text x="26" y="702.0" fill="#5b8cff" font-size="13" xml:space="preserve">  unambiguousClass.</text>
</svg>