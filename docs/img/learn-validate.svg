<svg xmlns="http://www.w3.org/2000/svg" width="704" height="924" viewBox="0 0 704 924" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<rect width="704" height="924" rx="10" fill="#0a0e1a"/>
<rect x="0.5" y="0.5" width="703" height="923" rx="10" fill="none" stroke="#1e2942"/>
<rect x="1" y="1" width="702" height="38" rx="9" fill="#111725"/>
<rect x="1" y="30" width="702" height="10" fill="#111725"/>
<line x1="1" y1="39.5" x2="703" y2="39.5" stroke="#1e2942"/>
<circle cx="22" cy="20" r="5" fill="#e05a5a" opacity="0.55"/>
<circle cx="39" cy="20" r="5" fill="#e8b04b" opacity="0.55"/>
<circle cx="56" cy="20" r="5" fill="#3fb984" opacity="0.55"/>
<text x="352.0" y="25" fill="#6b7a99" font-size="12.5" text-anchor="middle">meshctl learn validate</text>
<text x="26" y="62.0" fill="#ffffff" font-size="13" font-weight="600" xml:space="preserve">counterfactual validation  120000 incidents, seed fixed</text>
<text x="26" y="102.0" fill="#5b8cff" font-size="13" xml:space="preserve">  the gate first</text>
<text x="26" y="122.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    actionable                107805</text>
<text x="26" y="142.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    refused outright          12195</text>
<text x="26" y="162.0" fill="#c8d3e8" font-size="13" xml:space="preserve">      DELAY_EXCEEDS_ACTION_SPACE 6295</text>
<text x="26" y="182.0" fill="#c8d3e8" font-size="13" xml:space="preserve">      TERMINAL_DECLINE         5900</text>
<text x="26" y="202.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    arms left to explore</text>
<text x="26" y="222.0" fill="#c8d3e8" font-size="13" xml:space="preserve">      2 hours                  74124 incidents</text>
<text x="26" y="242.0" fill="#c8d3e8" font-size="13" xml:space="preserve">      24 hours                 107805 incidents</text>
<text x="26" y="262.0" fill="#c8d3e8" font-size="13" xml:space="preserve">      30 minutes               50472 incidents</text>
<text x="26" y="282.0" fill="#c8d3e8" font-size="13" xml:space="preserve">      5 minutes                38802 incidents</text>
<text x="26" y="302.0" fill="#c8d3e8" font-size="13" xml:space="preserve">      6 hours                  76696 incidents</text>
<text x="26" y="342.0" fill="#5b8cff" font-size="13" xml:space="preserve">  what each policy actually earns, run on identical luck</text>
<text x="26" y="362.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    policy            recovered      net paisa     per decision</text>
<text x="26" y="382.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    backoff               23.8%     6285480732          58304.2</text>
<text x="26" y="402.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    uniform               26.7%     7083577436          65707.3</text>
<text x="26" y="422.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    thompson              30.9%     8324681718          77219.8</text>
<text x="26" y="462.0" fill="#5b8cff" font-size="13" xml:space="preserve">  the log the estimate is made from</text>
<text x="26" y="482.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    logging policy            uniform</text>
<text x="26" y="502.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    spent on exploration      52.7%</text>
<text x="26" y="522.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    reward model skill        0.072 (held out), AUC 0.682</text>
<text x="26" y="562.0" fill="#5b8cff" font-size="13" xml:space="preserve">  the estimate, from the log alone</text>
<text x="26" y="582.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    candidate policy          segment:candidate</text>
<text x="26" y="602.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    value per decision        66455.0  [64612.0, 68569.2] at 95%</text>
<text x="26" y="622.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    lift over deployed        890.2  [455.8, 1221.0]   (doubly-robust-difference)</text>
<text x="26" y="642.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    decisions that differ     1645</text>
<text x="26" y="662.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    effective sample size     103063  (96% of the log)</text>
<text x="26" y="702.0" fill="#5b8cff" font-size="13" font-weight="600" xml:space="preserve">  the answer key, opened only now</text>
<text x="26" y="722.0" fill="#3fb984" font-size="13" xml:space="preserve">    true value per decision   67483.6    inside the interval</text>
<text x="26" y="742.0" fill="#3fb984" font-size="13" xml:space="preserve">    true lift                 1200.2    inside the interval</text>
<text x="26" y="762.0" fill="#c8d3e8" font-size="13" xml:space="preserve">    relative error            -1.52%</text>
<text x="26" y="802.0" fill="#5b8cff" font-size="13" xml:space="preserve">  the interval contained the truth</text>
<text x="26" y="842.0" fill="#5b8cff" font-size="13" xml:space="preserve">  Nothing above consulted the latent outcome model until the last block.</text>
<text x="26" y="862.0" fill="#5b8cff" font-size="13" xml:space="preserve">  On live traffic that block does not exist, which is why nobody else</text>
<text x="26" y="882.0" fill="#5b8cff" font-size="13" xml:space="preserve">  can tell you whether their counterfactual was accurate.</text>
</svg>